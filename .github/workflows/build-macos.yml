# 在 GitHub 的 macOS 机器上把「简记」打成 .dmg 并作为 artifact 传上来。
#
# **为什么需要它**：dmg 只能在 macOS 上产出（`hdiutil` / `codesign` / `.app` 的
# 组装都是 macOS 专有）。开发者手边那台 Windows 写得出这些脚本，但**验证不了产物**。
# 这个 workflow 就是那条「验证得了」的路径 —— 而且不需要开发者有 Mac。
#
# 怎么用：
#   1. 把仓库推到 GitHub（用工程根的 `push_backup.cmd`）；
#   2. 打开仓库的 Actions 页，选「构建 macOS dmg」，点 Run workflow；
#   3. 跑完在页面底部下载 `jianji-dmg-arm64` / `jianji-dmg-x86_64`。
#   打了 `v*` 形式的 tag 也会自动跑一次。
#
# 产物**没有 Apple 开发者签名**（ad-hoc 签名），所以在别人机器上首次打开会被
# Gatekeeper 拦一次。放行办法写在 `build_macos/README.md` 里。
name: 构建 macOS dmg

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false          # 一个架构挂了，另一个照样出结果——不然什么都看不到
      matrix:
        include:
          # Apple Silicon。GitHub 现在的主力 macOS runner。
          - runner: macos-14
            label: arm64
          # Intel。macos-13 是最后一代 x86_64 runner。
          - runner: macos-13
            label: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: 确认 runner 上的 python3 带 tkinter
        # 简记的界面就是 tkinter；缺了它连窗口都开不了，早点失败比打包完才发现好。
        run: |
          python3 --version
          python3 -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: 装 create-dmg
        # 有它 dmg 里才会摆好图标和「拖进应用程序」的箭头；没有的话 build_dmg.sh
        # 会退回 hdiutil，dmg 照样出得来，只是朴素一点。
        run: brew install create-dmg

      - name: 打包
        run: bash build_macos/build_dmg.sh

      - name: 校验产物
        run: |
          set -euo pipefail
          APP="dist/简记.app"
          test -d "$APP" || { echo "没有 $APP"; exit 1; }
          plutil -lint "$APP/Contents/Info.plist"
          # ad-hoc 签名也要验：结构坏了（比如 Info.plist 缺 CFBundleExecutable）
          # 这一步会直接报出来，而不是等用户双击才发现。
          codesign --verify --deep --strict --verbose=2 "$APP"
          ls -la dist/

      - name: 冒烟测试（能不能真的启动）
        # 这是**唯一一条能证明「移植成功」的检查**：别的都只说明文件摆对了位置。
        # GUI 在 CI 上靠 runner 自带的窗口服务跑得起来；万一哪天这条开始偶发失败，
        # 先在本地 Mac 上跑一遍确认不是代码问题，再考虑放宽这里的等待时间。
        run: |
          set -uo pipefail
          "./dist/简记.app/Contents/MacOS/JianJi" > /tmp/jianji.log 2>&1 &
          PID=$!
          sleep 8
          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID" || true
            echo "✓ 窗口起来了，8 秒后仍在运行"
          else
            echo "✗ 进程启动即退出，日志："
            cat /tmp/jianji.log
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: jianji-dmg-${{ matrix.label }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30
